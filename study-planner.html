<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Planner</title><link rel="icon" href="favicon-32.png"><script src="auth.js"></script><link rel="stylesheet" href="productivity.css"></head><body><template id="navtemplate"><aside class="sidebar"><img src="logo.png" alt="Logo"><h2>Study Planner</h2><small>Personal Hub</small><hr><a href="index.html">⌂ Home</a><a href="hub.html">▤ Revision Dashboard</a><a href="financial-manager.html">▣ Financial Manager</a><a href="calendar.html" data-page="calendar">▦ Calendar</a><a href="achievements.html" data-page="achievements">★ Achievements</a><a href="study-planner.html" data-page="study-planner">☑ Study Planner</a></aside></template><script src="productivity-core.js"></script><script>if(!PersonalHubAuth.isUnlocked())location.replace("index.html");const CATALOG={"FIA — Introductory": {"FA1 — Recording Financial Transactions": ["Business transactions and source documents", "Double-entry bookkeeping", "Sales and purchases", "Cash and bank transactions", "Payroll transactions", "Ledger accounts and trial balance", "Errors and suspense accounts"], "MA1 — Management Information": ["Cost classification and behaviour", "Sources of management information", "Cost recording", "Materials and inventory", "Labour costs", "Overheads", "Costing techniques", "Spreadsheets and information presentation"]}, "FIA — Intermediate": {"FA2 — Maintaining Financial Records": ["Accounting principles and concepts", "Double entry and accounting systems", "Accruals and prepayments", "Non-current assets and depreciation", "Inventory valuation", "Irrecoverable debts and allowances", "Bank reconciliations", "Control accounts", "Correction of errors", "Financial statements"], "MA2 — Managing Costs and Finance": ["Cost classification and cost behaviour", "Cost accounting techniques", "Overhead absorption", "Job and batch costing", "Process costing", "Service costing", "Budgeting and variance analysis", "Cash budgets", "Investment appraisal", "Performance measurement"]}, "FIA — Diploma": {"FBT — Foundations in Business and Technology": ["Business organisations and stakeholders", "Business environment", "Organisation structure and governance", "Accounting and reporting systems", "Leadership and management", "Personal effectiveness", "Professional ethics"], "FMA — Management Accounting": ["Management information", "Cost accounting techniques", "Budgeting", "Standard costing and variances", "Performance measurement"], "FFA — Financial Accounting": ["Financial reporting framework", "Accounting principles and double entry", "Recording transactions and events", "Trial balance and corrections", "Preparing financial statements", "Basic consolidation", "Interpreting financial statements"]}, "FIA — Specialist": {"FAU — Foundations in Audit": ["Nature and purpose of audit", "Audit regulation and ethics", "Audit planning and risk", "Internal control", "Audit evidence and procedures", "Audit completion and reporting"], "FFM — Foundations in Financial Management": ["Financial management function", "Working capital management", "Investment appraisal", "Business finance", "Cost of capital", "Risk management"], "FTX — Foundations in Taxation": ["Tax system and administration", "Income tax", "Employment and business income", "Capital allowances", "Corporation tax", "Capital gains tax", "Indirect taxes"]}, "ACCA — Applied Knowledge": {"BT — Business and Technology": ["Business organisations and stakeholders", "Business environment", "Governance and ethics", "Accounting systems and controls", "Leadership and teams", "Personal effectiveness"], "MA — Management Accounting": ["Management information", "Cost accounting techniques", "Budgeting", "Standard costing", "Performance measurement"], "FA — Financial Accounting": ["Accounting framework", "Recording transactions", "Trial balance and corrections", "Financial statements", "Consolidation basics", "Financial statement interpretation"]}, "ACCA — Applied Skills": {"LW — Corporate and Business Law": ["Legal system and sources of law", "Contract law", "Employment law", "Business organisations", "Company formation and capital", "Directors and governance", "Insolvency and corporate crime"], "PM — Performance Management": ["Specialist cost and management accounting", "Decision-making techniques", "Budgeting and control", "Standard costing and variances", "Performance measurement"], "TX — Taxation": ["Tax system and administration", "Income tax", "Corporation tax", "Capital gains tax", "Inheritance or other jurisdiction-specific taxes", "Indirect taxes and compliance"], "FR — Financial Reporting": ["Conceptual and regulatory framework", "Accounting for transactions", "Financial statement preparation", "Consolidated financial statements", "Analysis and interpretation"], "AA — Audit and Assurance": ["Audit framework and regulation", "Planning and risk assessment", "Internal control", "Audit evidence", "Review and reporting"], "FM — Financial Management": ["Financial management function", "Financial management environment", "Working capital management", "Investment appraisal", "Business finance", "Cost of capital", "Business valuations", "Risk management"]}, "ACCA — Strategic Professional Essentials": {"SBL — Strategic Business Leader": ["Leadership and governance", "Strategy and strategic analysis", "Risk management", "Technology and data analytics", "Organisational control and audit", "Finance in decision making", "Change management and professional skills"], "SBR — Strategic Business Reporting": ["Ethical and professional principles", "Financial reporting framework", "Reporting financial performance", "Group financial statements", "Stakeholder reporting", "Interpretation of financial statements"]}, "ACCA — Strategic Professional Options": {"AFM — Advanced Financial Management": ["Financial management in organisations", "Advanced investment appraisal", "Acquisitions and mergers", "Corporate reconstruction", "Treasury and advanced risk management"], "APM — Advanced Performance Management": ["Strategic planning and control", "External influences on performance", "Performance measurement systems", "Strategic performance measurement", "Performance evaluation and corporate failure"], "ATX — Advanced Taxation": ["Advanced tax principles", "Personal tax planning", "Corporate tax planning", "Capital gains and inheritance planning", "International taxation", "Professional advice and ethics"], "AAA — Advanced Audit and Assurance": ["Regulatory environment", "Professional and ethical considerations", "Planning and risk assessment", "Audit evidence and advanced procedures", "Completion and reporting", "Other assignments"]}, "Modules": {"FiP — Foundations in Professionalism": ["Professional ethics", "Professionalism and workplace behaviour", "Communication and personal effectiveness"], "EPSM — Ethics and Professional Skills": ["Ethics and professionalism", "Personal effectiveness", "Innovation and scepticism", "Commercial awareness", "Leadership and teamwork", "Communication", "Data analytics and integrated case study"]}};
const PAPER_GROUP=Object.fromEntries(Object.entries(CATALOG).flatMap(([g,ps])=>Object.keys(ps).map(p=>[p,g])));
function opts(items,placeholder){return '<option value="">'+placeholder+'</option>'+items.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}
function paperOptions(){return '<option value="">Select paper / module</option>'+Object.entries(CATALOG).map(([g,ps])=>'<optgroup label="'+esc(g)+'">'+Object.keys(ps).map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('')+'</optgroup>').join('')}
function setTopics(form){const p=form.elements.paper.value,sel=form.elements.topic;sel.innerHTML=opts(CATALOG[PAPER_GROUP[p]]?.[p]||[],'Select syllabus topic')+'<option value="__custom__">Other / custom topic</option>';form.elements.customTopic.hidden=true;form.elements.customTopic.required=false;form.elements.customTopic.value=''}
function toggleCustom(form){const yes=form.elements.topic.value==='__custom__';form.elements.customTopic.hidden=!yes;form.elements.customTopic.required=yes}
function paperFields(){return '<select name="paper" required autocomplete="off" onchange="setTopics(this.form)">'+paperOptions()+'</select><select name="topic" required autocomplete="off" onchange="toggleCustom(this.form)"><option value="">Select a paper first</option></select><input name="customTopic" placeholder="Enter custom topic" autocomplete="off" hidden maxlength="120">'}
function render(){let sugg=readSuggestions();let content='<div class="stats"><div class="stat">'+db.tasks.length+'<div class="muted">Planned tasks</div></div><div class="stat">'+completed().length+'<div class="muted">Completed tasks</div></div><div class="stat">'+streak()+' days<div class="muted">Current streak</div></div></div><div class="panel" style="margin-top:16px"><h2>Add a study task</h2><form id="taskForm" class="toolbar" autocomplete="off"><input name="title" placeholder="What will you study?" required maxlength="120" autocomplete="off">'+paperFields()+'<input name="date" type="date" required><select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select><button>Add task</button></form></div><div class="panel" style="margin-top:16px"><h2>Suggested revisions</h2><p class="muted">Suggestions use available saved topic-mastery data. You control what gets scheduled.</p>'+(sugg.length?sugg.map((s,i)=>'<div class="task"><div class="grow"><b>'+esc(s.title)+'</b> <span class="pill">'+esc(s.priority)+'</span></div><button onclick="addSuggestion('+i+')">Add to plan</button></div>').join(''):'<p class="muted">No weak-topic snapshot detected yet. Add your own tasks, or review topic-tagged tests in the Revision Dashboard.</p>')+'</div><div class="panel" style="margin-top:16px"><h2>Your study plan</h2>'+(db.tasks.length?db.tasks.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(taskHtml).join(''):'<p class="muted">No tasks added yet.</p>')+'</div><div class="panel" style="margin-top:16px"><h2>Log study session</h2><form id="sessionForm" class="toolbar" autocomplete="off">'+paperFields()+'<input name="minutes" type="number" min="1" max="1440" placeholder="Minutes" required><button>Log session (+10 XP)</button></form><p class="muted">Total logged: '+db.sessions.reduce((n,s)=>n+Number(s.minutes),0)+' minutes</p><a class="btn" href="calendar.html">Open Calendar →</a></div>';shell('study-planner','Smart Study Planner','FIA and ACCA syllabus catalogue, study tasks and session tracking.',content);const date=document.querySelector('#taskForm [name="date"]');if(date)date.value=iso(new Date());window.suggestions=sugg}
function addSuggestion(i){let s=window.suggestions[i];if(!s)return;db.tasks.push({...s,id:id(),date:iso(new Date()),done:false});save();render()}
function dataFrom(form){let entry=Object.fromEntries(new FormData(form));if(entry.topic==='__custom__')entry.topic=entry.customTopic.trim();if(!entry.topic)throw Error('Choose a topic');entry.subject=entry.paper;delete entry.customTopic;return entry}
document.addEventListener('submit',e=>{if(e.target.id==='taskForm'){e.preventDefault();let entry;try{entry=dataFrom(e.target)}catch(err){alert(err.message);return}db.tasks.push({...entry,id:id(),done:false});save();render()}if(e.target.id==='sessionForm'){e.preventDefault();let entry;try{entry=dataFrom(e.target)}catch(err){alert(err.message);return}db.sessions.push({...entry,id:id(),date:new Date().toISOString()});save();render()}});render();</script></body></html>
