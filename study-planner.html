<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Planner · Mari Kita Belajar</title><link rel="icon" href="favicon-32.png"><script src="auth.js"></script><link rel="stylesheet" href="productivity.css"></head><body><template id="navtemplate"><aside class="sidebar"><img src="logo.png" alt="Logo"><h2>MARI KITA BELAJAR</h2><small>Personal Hub</small><hr><a href="index.html">⌂ Home</a><a href="hub.html">▤ Revision Dashboard</a><a href="financial-manager.html">▣ Financial Manager</a><a href="calendar.html" data-page="calendar">▦ Calendar</a><a href="achievements.html" data-page="achievements">★ Achievements</a><a href="study-planner.html" data-page="study-planner">☑ Study Planner</a></aside></template><script src="productivity-core.js"></script><script>if(!PersonalHubAuth.isUnlocked())location.replace("index.html");function render(){let sugg=readSuggestions();let content='<div class="stats"><div class="stat">'+db.tasks.length+'<div class="muted">Planned tasks</div></div><div class="stat">'+completed().length+'<div class="muted">Completed tasks</div></div><div class="stat">'+streak()+' days<div class="muted">Current streak</div></div></div><div class="panel" style="margin-top:16px"><h2>Add a study task</h2><form id="taskForm" class="toolbar"><input name="title" placeholder="What will you study?" required maxlength="120"><input name="subject" placeholder="Paper / subject"><input name="date" type="date" required><select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select><button>Add task</button></form></div><div class="panel" style="margin-top:16px"><h2>Suggested revisions</h2><p class="muted">Suggestions use available saved topic-mastery data. You control what gets scheduled.</p>'+(sugg.length?sugg.map((s,i)=>'<div class="task"><div class="grow"><b>'+esc(s.title)+'</b> <span class="pill">'+esc(s.priority)+'</span></div><button onclick="addSuggestion('+i+')">Add to plan</button></div>').join(''):'<p class="muted">No weak-topic snapshot detected yet. Add your own tasks, or review topic-tagged tests in the Revision Dashboard.</p>')+'</div><div class="panel" style="margin-top:16px"><h2>Your study plan</h2>'+(db.tasks.length?db.tasks.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(taskHtml).join(''):'<p class="muted">No tasks added yet.</p>')+'</div><div class="panel" style="margin-top:16px"><h2>Log study session</h2><form id="sessionForm" class="toolbar"><input name="subject" placeholder="Subject" required><input name="minutes" type="number" min="1" max="1440" placeholder="Minutes" required><button>Log session (+10 XP)</button></form><p class="muted">Total logged: '+db.sessions.reduce((n,s)=>n+Number(s.minutes),0)+' minutes</p><a class="btn" href="calendar.html">Open Calendar →</a></div>';shell('study-planner','Smart Study Planner','Suggested revisions, editable tasks and study-session tracking.',content);document.querySelector('[name="date"]').value=iso(new Date());window.suggestions=sugg}function addSuggestion(i){let s=window.suggestions[i];if(!s)return;db.tasks.push({...s,id:id(),date:iso(new Date()),done:false});save();render()}document.addEventListener('submit',e=>{if(e.target.id==='taskForm'){e.preventDefault();db.tasks.push({...Object.fromEntries(new FormData(e.target)),id:id(),done:false});save();render()}if(e.target.id==='sessionForm'){e.preventDefault();db.sessions.push({...Object.fromEntries(new FormData(e.target)),id:id(),date:new Date().toISOString()});save();render()}});render();</script></body></html>
