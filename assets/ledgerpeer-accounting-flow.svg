<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 610" role="img" aria-labelledby="lp-flow-title lp-flow-description">
<title id="lp-flow-title">Accounting records: from a credit sale to the financial statements</title>
<desc id="lp-flow-description">Original LedgerPeer workflow. A credit sale of $1,200 is documented by an invoice, entered in the sales day book, posted to trade receivables and sales, checked in the trial balance, adjusted at year end and presented in the financial statements. A dotted branch identifies the customer subledger, which must reconcile to receivables control; it is not a subsequent processing step. All card headings use the same display typeface and explanatory text uses the same monospace typeface.</desc>
<style>
.lp-display{font-family:"Arial Black","Helvetica Neue",Impact,Arial,sans-serif;font-weight:900;letter-spacing:-.025em;fill:#151515}
.lp-body{font-family:ui-monospace,"JetBrains Mono","Space Mono",Menlo,Consolas,monospace;fill:#151515;font-weight:550}
.lp-overline{font-size:14px;font-weight:800;letter-spacing:.045em}
.lp-title{font-size:31px}
.lp-subtitle{font-size:17px}
.lp-card-title{font-size:18px}
.lp-card-body{font-size:17px}
.lp-card-detail{font-size:15px}
.lp-footer{font-size:14px}
.lp-card{stroke:#151515;stroke-width:4}
.lp-rule{stroke:#151515;stroke-width:2;opacity:.45}
.lp-path{fill:none;stroke:#151515;stroke-width:4;stroke-linecap:square;stroke-linejoin:round}
</style>
<defs>
 <marker id="lp-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
  <path d="M0 0 L8 4 L0 8 z" fill="#151515"/>
 </marker>
</defs>
<rect width="1220" height="610" fill="#fffaf1"/>
<text class="lp-body lp-overline" x="36" y="35">LEDGERPEER   /   ACCOUNTING INFORMATION FLOW</text>
<text class="lp-display lp-title" x="36" y="80">FOLLOW ONE TRANSACTION THROUGH THE BOOKS</text>
<text class="lp-body lp-subtitle" x="36" y="112">Example: inventory sold on credit for $1,200 (sales tax excluded).</text>
<line class="lp-rule" x1="34" y1="125" x2="1186" y2="125"/>

<!-- The four sequential bookkeeping stages share consistent card geometry. -->
<rect class="lp-card" x="34"  y="145" width="240" height="160" rx="3" fill="#ffce25"/>
<rect class="lp-card" x="316" y="145" width="245" height="160" rx="3" fill="#fff"/>
<rect class="lp-card" x="603" y="145" width="260" height="160" rx="3" fill="#e6efff"/>
<rect class="lp-card" x="905" y="145" width="281" height="160" rx="3" fill="#e7f6e7"/>

<text class="lp-display lp-card-title" x="52"  y="175">01 / SOURCE</text>
<text class="lp-display lp-card-title" x="334" y="175">02 / ORIGINAL ENTRY</text>
<text class="lp-display lp-card-title" x="621" y="175">03 / GENERAL LEDGER</text>
<text class="lp-display lp-card-title" x="923" y="175">04 / TRIAL BALANCE</text>
<path class="lp-rule" d="M52 191 H256 M334 191 H543 M621 191 H845 M923 191 H1168"/>

<g class="lp-body lp-card-body">
 <text x="52" y="224">Credit sales invoice</text>
 <text x="52" y="254">Customer owes $1,200</text>

 <text x="334" y="224">Sales day book</text>
 <text x="334" y="254">Invoice: $1,200</text>

 <text x="621" y="224">Dr Receivables $1,200</text>
 <text x="621" y="254">Cr Sales $1,200</text>

 <text x="923" y="224">Debits = credits</text>
 <text x="923" y="254">Check trial balances</text>
</g>
<g class="lp-body lp-card-detail">
 <text x="52" y="284">Source evidence</text>
 <text x="334" y="284">First recording</text>
 <text x="621" y="284">Equal Dr and Cr</text>
 <text x="923" y="284">Arithmetic check</text>
</g>

<!-- Arrows are isolated in the gutters, never over card text. -->
<g class="lp-path" marker-end="url(#lp-arrow)">
 <path d="M281 225 H308"/>
 <path d="M568 225 H595"/>
 <path d="M870 225 H897"/>
</g>

<!-- Customer subledger is a subsidiary reconciliation branch, not step 05. -->
<path class="lp-path" d="M734 307 V342 H231 V395" stroke-dasharray="10 9" marker-end="url(#lp-arrow)"/>
<text class="lp-body lp-overline" x="45" y="382">SUBLEDGER DETAIL / RECONCILE</text>

<!-- Trial balance leads to adjusting entries, then final statements. -->
<path class="lp-path" d="M1046 307 V368 H650 V395" marker-end="url(#lp-arrow)"/>

<rect class="lp-card" x="34" y="405" width="402" height="144" rx="3" fill="#f2e4fa"/>
<rect class="lp-card" x="508" y="405" width="295" height="144" rx="3" fill="#f4eadf"/>
<rect class="lp-card" x="876" y="405" width="310" height="144" rx="3" fill="#ffce25"/>

<text class="lp-display lp-card-title" x="52" y="435">CUSTOMER SUBLEDGER</text>
<text class="lp-display lp-card-title" x="526" y="435">05 / ADJUSTMENTS</text>
<text class="lp-display lp-card-title" x="894" y="435">06 / STATEMENTS</text>
<path class="lp-rule" d="M52 448 H418 M526 448 H785 M894 448 H1168"/>
<g class="lp-body lp-card-body">
 <text x="52" y="475">Customer A: Dr $1,200</text>
 <text x="52" y="503">Agree to receivables</text>
 <text x="52" y="531">control account balance</text>

 <text x="526" y="475">Accruals, inventory,</text>
 <text x="526" y="503">depreciation, etc.</text>
 <text x="526" y="531">Adjusted trial balance</text>

 <text x="894" y="475">Financial statements</text>
 <text x="894" y="503">Profit or loss</text>
 <text x="894" y="531">Financial position</text>
</g>
<path class="lp-path" d="M811 480 H867" marker-end="url(#lp-arrow)"/>

<line class="lp-rule" x1="34" y1="570" x2="1186" y2="570"/>
<text class="lp-body lp-footer" x="36" y="591">Customer detail reconciles to control. Inventory cost is recorded separately when known.</text>
</svg>
