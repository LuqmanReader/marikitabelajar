<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar · Mari Kita Belajar</title><link rel="icon" href="favicon-32.png"><script src="auth.js"></script><link rel="stylesheet" href="productivity.css"></head><body><template id="navtemplate"><aside class="sidebar"><img src="logo.png" alt="Logo"><h2>MARI KITA BELAJAR</h2><small>Personal Hub</small><hr><a href="index.html">⌂ Home</a><a href="hub.html">▤ Revision Dashboard</a><a href="financial-manager.html">▣ Financial Manager</a><a href="calendar.html" data-page="calendar">▦ Calendar</a><a href="achievements.html" data-page="achievements">★ Achievements</a><a href="study-planner.html" data-page="study-planner">☑ Study Planner</a></aside></template><script src="productivity-core.js"></script><script>if(!PersonalHubAuth.isUnlocked())location.replace("index.html");let cursor=new Date(),selected=iso(new Date()),view='month';
function move(n){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);render()}
function render(){
const d=new Date(cursor.getFullYear(),cursor.getMonth(),1),month=d.toLocaleDateString('en-GB',{month:'long',year:'numeric'}),start=new Date(d);start.setDate(start.getDate()-(start.getDay()+6)%7);
let cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(n=>`<div class="weekday">${n}</div>`).join('');
for(let i=0;i<42;i++){let x=new Date(start);x.setDate(start.getDate()+i);let day=iso(x);cells+=`<div class="day ${x.getMonth()!==d.getMonth()?'other':''} ${day===selected?'selected':''}" onclick="selected='${day}';render()"><strong>${x.getDate()}</strong>${db.events.filter(e=>e.date===day).slice(0,3).map(e=>`<span class="event ${esc(e.type)}">${esc(e.title)}</span>`).join('')}${db.tasks.filter(t=>t.date===day).slice(0,2).map(t=>`<span class="event">${t.done?'✓ ':''}${esc(t.title)}</span>`).join('')}</div>`}
let ev=db.events.filter(e=>e.date===selected).sort((a,b)=>(a.time||'').localeCompare(b.time||'')),tasks=db.tasks.filter(t=>t.date===selected);
let content=`<div class="layout"><section class="panel"><div class="toolbar"><button onclick="move(-1)">‹</button><button onclick="move(1)">›</button><h2>${month}</h2><button onclick="view='month';render()">Month</button><button onclick="view='week';render()">Week</button><button onclick="view='day';render()">Day</button><button onclick="cursor=new Date();selected=iso(cursor);render()">Today</button><button onclick="openEvent()">+ Add Event</button></div><div class="calgrid">${cells}</div></section><aside class="sidecol"><div class="panel"><h2>${selected}</h2><div class="muted">Selected date</div></div><div class="panel"><h2>Events</h2>${ev.map(e=>`<div class="item"><b>${esc(e.title)}</b><div class="muted">${esc(e.time||'All day')} · ${esc(e.type)}</div><button onclick="editEvent('${e.id}')">Edit</button> <button onclick="deleteEvent('${e.id}')">Delete</button></div>`).join('')||'<p>No events yet.</p>'}<button onclick="openEvent()">+ Add Event</button></div><div class="panel"><h2>Study tasks</h2>${tasks.map(taskHtml).join('')||'<p>No tasks scheduled.</p>'}<a class="btn" href="study-planner.html">Study Planner →</a></div><div class="panel"><h2>Quick add</h2><button onclick="openEvent('study')">Study</button> <button onclick="openEvent('exam')">Exam</button> <button onclick="openEvent('personal')">Personal</button></div></aside></div><dialog id="eventDialog"><form id="eventForm"><h2>Calendar event</h2><input type="hidden" name="id"><label class="field">Title<input name="title" required maxlength="120"></label><label class="field">Date<input name="date" type="date" required></label><label class="field">Time<input name="time" type="time"></label><label class="field">Category<select name="type"><option value="study">Study</option><option value="exam">Examination</option><option value="class">Class</option><option value="personal">Personal</option><option value="other">Other</option></select></label><button>Save event</button> <button type="button" onclick="document.getElementById('eventDialog').close()">Cancel</button></form></dialog>`;
shell('calendar','Calendar','Manage your schedule, study sessions and important events.',content);
if(view!=='month'){let base=new Date(selected+'T12:00:00');base.setDate(base.getDate()-(base.getDay()+6)%7);let end=new Date(base);end.setDate(end.getDate()+7);let list=[...db.events,...db.tasks].filter(e=>view==='day'?e.date===selected:new Date(e.date+'T12:00:00')>=base&&new Date(e.date+'T12:00:00')<end);document.querySelector('.calgrid').outerHTML=`<div>${list.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="item">${esc(e.date)} — ${esc(e.title)}</div>`).join('')||'Nothing scheduled.'}</div>`}
}
function openEvent(type){let f=document.getElementById('eventForm');f.reset();f.elements.id.value='';f.elements.date.value=selected;f.elements.type.value=type||'study';document.getElementById('eventDialog').showModal()}
function editEvent(k){let e=db.events.find(x=>x.id===k);if(!e)return;openEvent(e.type);let f=document.getElementById('eventForm');for(let key of ['id','title','date','time','type'])f.elements[key].value=e[key]||''}
function deleteEvent(k){if(confirm('Delete event?')){db.events=db.events.filter(e=>e.id!==k);save();render()}}
document.addEventListener('submit',e=>{if(e.target.id!=='eventForm')return;e.preventDefault();let entry=Object.fromEntries(new FormData(e.target));entry.id=entry.id||id();db.events=db.events.filter(x=>x.id!==entry.id);db.events.push(entry);save();selected=entry.date;cursor=new Date(entry.date+'T12:00:00');render()});render();
</script></body></html>
