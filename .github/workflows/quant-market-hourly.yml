name: QUANT hourly market data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quant-market-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate historical S&P 500 closes
        run: python scripts/refresh_quant_market.py
      - name: Commit verified cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quant-sp500.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh QUANT verified market snapshot"
            git push
          fi
