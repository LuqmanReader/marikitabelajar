name: LedgerPeer Notes quality gate

on:
  push:
    branches: [main]
    paths:
      - 'notes.html'
      - 'notes-page.js'
      - 'notes-data.js'
      - 'notes-expanded-data.js'
      - 'notes-uk-syllabi.js'
      - 'notes-visual-*.js'
      - 'notes-release.json'
      - 'notes-build.js'
      - 'subject-catalog.js'
      - 'acca-published-data.js'
      - 'textbook-*.js'
      - 'notes-2026-*.js'
      - 'notes-atx-2026-*.js'
      - 'audit/notes-2026-27-review-matrix.json'
      - 'audit/authored-chapter-index.json'
      - 'tests/notes-*.cjs'
      - 'scripts/audit-first350-*.py'
      - 'scripts/export-first350-live-lessons.cjs'
      - '.github/workflows/notes-quality.yml'
  pull_request:
    paths:
      - 'notes.html'
      - 'notes-page.js'
      - 'notes-data.js'
      - 'notes-expanded-data.js'
      - 'notes-uk-syllabi.js'
      - 'notes-visual-*.js'
      - 'notes-release.json'
      - 'notes-build.js'
      - 'subject-catalog.js'
      - 'acca-published-data.js'
      - 'textbook-*.js'
      - 'notes-2026-*.js'
      - 'notes-atx-2026-*.js'
      - 'audit/notes-2026-27-review-matrix.json'
      - 'audit/authored-chapter-index.json'
      - 'tests/notes-*.cjs'
      - 'scripts/audit-first350-*.py'
      - 'scripts/export-first350-live-lessons.cjs'
      - '.github/workflows/notes-quality.yml'

permissions:
  contents: read

jobs:
  notes-regression:
    name: Structural and release consistency (not ACCA certification)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all 700 lessons and distinguish drafts
        run: node tests/notes-all700-teaching.cjs
      - name: Check textbook depth and lesson coverage
        run: node tests/notes-depth-regression.cjs
      - name: Check 2026-27 curriculum against 700 indexed ACCA topics
        run: node tests/notes-2026-curriculum.cjs
      - name: Upload 700-topic audit inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-2026-27-audit-inventory
          path: audit/notes-2026-27-inventory.json
          if-no-files-found: warn
      - name: Recompute 2026-27 MA FMA B2 forecasting, regression and indices
        run: node tests/notes-ma-fma-b2-2026-academic.cjs
      - name: Validate FA2 tax, BT ethics, and MA F2 F3 substantive 2026-27 corrections
        run: node tests/notes-first350-substantive-reconciliation.cjs
      - name: Regression for verified MA1, FA-FFA accounting-principle corrections and NPV
        run: node tests/notes-2026-academic-corrections.cjs
      - name: Export all 350 student-visible lesson records
        run: node scripts/export-first350-live-lessons.cjs
      - name: Upload exact 350 student-visible lesson contents for academic source review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first350-live-student-lessons
          path: audit/first350-live-lessons-ci.json
          if-no-files-found: error
      - name: Reconcile BT/FBT 2026 accounting technology, cybersecurity and ethics
        run: node tests/notes-bt-fbt-2026-technology-ethics.cjs
      - name: Verify all FA1 2026 detailed exam skill areas and worked-case results
        run: node tests/notes-fa1-2026-academic-gate.cjs
      - name: Verify MA and FMA B3 and C1 2026 detailed syllabus topics
        run: node tests/notes-ma-fma-2026-b3-c1.cjs
      - name: Recompute extractable arithmetic identities across all 350 live chapters
        run: python scripts/audit-first350-arithmetic.py
      - name: Upload full first-half arithmetic reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-first350-maths-review
          path: |
            audit/first350-arithmetic-evidence-ci.json
            audit/first350-arithmetic-evidence-ci.md
          if-no-files-found: warn
      - name: Install official PDF audit dependencies
        run: python -m pip install --disable-pip-version-check --quiet pymupdf requests
      - name: Reconcile MA1 2026-27 systems, information, cost classification and centres
        run: node tests/notes-ma1-fundamentals-2026.cjs
      - name: Recalculate MA1 MA2 and FFM 2026-27 applied cases
        run: node tests/notes-ma-cash-finance-2026.cjs
      - name: Enforce detailed FA and FFA 2026-27 A1 A3 A4 teaching outcomes
        run: node tests/notes-fa-ffa-a1-a3-a4-2026.cjs
      - name: Compare all 350 live lessons with source PDFs and evidence pages
        run: python scripts/audit-first350-official-pdfs.py
      - name: Upload first-350 official source evidence for detailed academic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-first350-official-source-review
          path: |
            audit/first350-official-syllabus-evidence-ci.json
            audit/first350-official-syllabus-evidence-ci.md
          if-no-files-found: warn
      - name: Audit the first 350 live teaching chapters and reconcile spot checks
        run: node tests/notes-first350-evidence.cjs
      - name: Upload first-half per-topic evidence and risk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-first350-evidence
          path: |
            audit/notes-first350-evidence.json
            audit/notes-first350-evidence.md
          if-no-files-found: error
      - name: Reconcile FA and FFA 2026-27 detailed academic outcomes and numeric results
        run: node tests/notes-fa-ffa-academic-crosswalk.cjs
      - name: Upload academic syllabus-to-lesson evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa-ffa-2026-27-academic-crosswalk
          path: audit/fa-ffa-2026-27-internal-crosswalk.json
          if-no-files-found: error
      - name: Check browser release markers and cache refresh
        run: node tests/notes-release-regression.cjs
      - name: Check authoring inventory consistency and pending technical review
        run: node tests/notes-review-matrix.cjs
