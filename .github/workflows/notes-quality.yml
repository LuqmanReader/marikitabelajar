name: LedgerPeer Notes quality gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'notes.html'
      - 'notes-page.js'
      - 'notes-data.js'
      - 'notes-expanded-data.js'
      - 'notes-uk-syllabi.js'
      - 'notes-visual-*.js'
      - 'notes-release.json'
      - 'notes-build.js'
      - 'subject-catalog.js'
      - 'acca-published-data.js'
      - 'textbook-*.js'
      - 'notes-2026-*.js'
      - 'notes-atx-2026-*.js'
      - 'audit/notes-2026-27-review-matrix.json'
      - 'audit/academic-reviews/*.json'
      - 'audit/authored-chapter-index.json'
      - 'tests/notes-*.cjs'
      - 'scripts/audit-first350-*.py'
      - 'scripts/audit-all700-*.py'
      - 'scripts/export-first350-live-lessons.cjs'
      - 'scripts/export-all700-live-lessons.cjs'
      - 'scripts/build-all700-academic-docket.cjs'
      - 'scripts/build-all700-outcome-crosswalk.cjs'
      - 'scripts/build-all700-full-academic-review.cjs'
      - '.github/workflows/notes-quality.yml'
  pull_request:
    paths:
      - 'notes.html'
      - 'notes-page.js'
      - 'notes-data.js'
      - 'notes-expanded-data.js'
      - 'notes-uk-syllabi.js'
      - 'notes-visual-*.js'
      - 'notes-release.json'
      - 'notes-build.js'
      - 'subject-catalog.js'
      - 'acca-published-data.js'
      - 'textbook-*.js'
      - 'notes-2026-*.js'
      - 'notes-atx-2026-*.js'
      - 'audit/notes-2026-27-review-matrix.json'
      - 'audit/academic-reviews/*.json'
      - 'audit/authored-chapter-index.json'
      - 'tests/notes-*.cjs'
      - 'scripts/audit-first350-*.py'
      - 'scripts/audit-all700-*.py'
      - 'scripts/export-first350-live-lessons.cjs'
      - 'scripts/export-all700-live-lessons.cjs'
      - 'scripts/build-all700-academic-docket.cjs'
      - 'scripts/build-all700-outcome-crosswalk.cjs'
      - 'scripts/build-all700-full-academic-review.cjs'
      - '.github/workflows/notes-quality.yml'

concurrency:
  group: notes-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notes-regression:
    name: Structural and release consistency (not ACCA certification)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all 700 lessons and distinguish drafts
        run: node tests/notes-all700-teaching.cjs
      - name: Export every live topic with actual reader precedence and content hashes
        run: node scripts/export-all700-live-lessons.cjs
      - name: Screen all 700 live chapters and create an evidence queue
        run: node tests/notes-all700-evidence.cjs
      - name: Upload complete 700-chapter evidence and quality preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-all700-academic-preflight
          path: |
            audit/all700-live-lessons-ci.json
            audit/all700-quality-preflight-ci.json
            audit/all700-quality-preflight-ci.md
          if-no-files-found: warn
      - name: Check textbook depth and lesson coverage
        run: node tests/notes-depth-regression.cjs
      - name: Check 2026-27 curriculum against 700 indexed ACCA topics
        run: node tests/notes-2026-curriculum.cjs
      - name: Upload 700-topic audit inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-2026-27-audit-inventory
          path: audit/notes-2026-27-inventory.json
          if-no-files-found: warn
      - name: Recompute 2026-27 MA FMA B2 forecasting, regression and indices
        run: node tests/notes-ma-fma-b2-2026-academic.cjs
      - name: Validate FA2 tax, BT ethics, and MA F2 F3 substantive 2026-27 corrections
        run: node tests/notes-first350-substantive-reconciliation.cjs
      - name: Regression for verified MA1, FA-FFA accounting-principle corrections and NPV
        run: node tests/notes-2026-academic-corrections.cjs
      - name: Export all 350 student-visible lesson records
        run: node scripts/export-first350-live-lessons.cjs
      - name: Upload exact 350 student-visible lesson contents for academic source review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first350-live-student-lessons
          path: audit/first350-live-lessons-ci.json
          if-no-files-found: error
      - name: Reconcile BT/FBT 2026 accounting technology, cybersecurity and ethics
        run: node tests/notes-bt-fbt-2026-technology-ethics.cjs
      - name: Validate MA2 2026 depreciation and investment time value arithmetic
        run: node tests/notes-ma2-depreciation-investment-2026.cjs
      - name: Reconcile FA2 and MA2 2026 records and cost-management outcomes
        run: node tests/notes-fa2-ma2-2026-academic-audit.cjs
      - name: Verify all FA1 2026 detailed exam skill areas and worked-case results
        run: node tests/notes-fa1-2026-academic-gate.cjs
      - name: Check corrected FA1 discount accounting and syllabus-scope presentation
        run: node tests/notes-fa1-discount-scope-2026.cjs
      - name: Verify FR B9 IFRS S1 current-edition coverage and browser cache
        run: node tests/notes-fr-ifrs-s1-2026.cjs
      - name: Verify MA and FMA B3 and C1 2026 detailed syllabus topics
        run: node tests/notes-ma-fma-2026-b3-c1.cjs
      - name: Recompute extractable arithmetic identities across all 350 live chapters
        run: python scripts/audit-first350-arithmetic.py
      - name: Upload full first-half arithmetic reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-first350-maths-review
          path: |
            audit/first350-arithmetic-evidence-ci.json
            audit/first350-arithmetic-evidence-ci.md
          if-no-files-found: warn
      - name: Install official PDF audit dependencies
        run: python -m pip install --disable-pip-version-check --quiet pymupdf requests
      - name: Recompute extractable equations across all 700 published lessons
        run: python scripts/audit-all700-arithmetic.py
      - name: Verify scaled financial units in extracted academic arithmetic
        run: node tests/notes-arithmetic-units.cjs
      - name: Reconcile explicitly recorded debit-credit journal postings across 700 lessons
        run: python scripts/audit-all700-journals.py
      - name: Prevent regressions in debit-credit posting evidence
        run: node tests/notes-journal-balance-audit.cjs
      - name: Screen all 700 topic outcomes against 22 official ACCA 2026-27 PDFs
        run: python scripts/audit-all700-official-pdfs.py
      - name: Create all-700 official learning-outcome to teaching crosswalk
        run: node scripts/build-all700-outcome-crosswalk.cjs
      - name: Test 700-lesson outcome mapping against live source and official syllabus
        run: node tests/notes-outcome-crosswalk.cjs
      - name: Upload full learning-outcome mapping for academic reviewers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-2026-27-all700-outcome-crosswalk
          path: |
            audit/all700-outcome-crosswalk-ci.json
            audit/all700-outcome-crosswalk-ci.csv
          if-no-files-found: warn
      - name: Generate complete outcome-by-outcome academic and worked-answer technical review registers
        run: node scripts/build-all700-full-academic-review.cjs
      - name: Check every outcome and answer has current review evidence
        run: node tests/notes-full-academic-review.cjs
      - name: Upload full outcome and worked-answer technical review records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerpeer-full-2026-27-academic-review
          path: |
            audit/all700-academic-outcome-review-ci.json
            audit/all700-academic-outcome-review-ci.csv
            audit/all700-technical-worked-answer-review-ci.json
            audit/all700-technical-worked-answer-review-ci.csv
            audit/all700-full-review-summary-ci.md
          if-no-files-found: error
      - name: Reconcile all 700 chapters with source, arithmetic and content evidence
        run: node scripts/build-all700-academic-docket.cjs
      - name: Upload cross-reconciled 700-lesson academic review docket
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-all700-academic-docket
          path: |
            audit/all700-academic-docket-ci.json
            audit/all700-academic-docket-ci.md
          if-no-files-found: warn
      - name: Block unsupported academic sign-off for any of the 700 topics
        run: node tests/notes-academic-proof-gate.cjs
      - name: Upload whole-library arithmetic and official-syllabus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-all700-official-and-maths-review
          path: |
            audit/all700-arithmetic-evidence-ci.json
            audit/all700-arithmetic-evidence-ci.md
            audit/all700-journal-balance-ci.json
            audit/all700-journal-balance-ci.md
            audit/all700-official-syllabus-evidence-ci.json
            audit/all700-official-syllabus-evidence-ci.md
          if-no-files-found: warn
      - name: Reconcile MA1 2026-27 systems, information, cost classification and centres
        run: node tests/notes-ma1-fundamentals-2026.cjs
      - name: Recalculate MA1 MA2 and FFM 2026-27 applied cases
        run: node tests/notes-ma-cash-finance-2026.cjs
      - name: Enforce detailed FA and FFA 2026-27 A1 A3 A4 teaching outcomes
        run: node tests/notes-fa-ffa-a1-a3-a4-2026.cjs
      - name: Compare all 350 live lessons with source PDFs and evidence pages
        run: python scripts/audit-first350-official-pdfs.py
      - name: Upload first-350 official source evidence for detailed academic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-first350-official-source-review
          path: |
            audit/first350-official-syllabus-evidence-ci.json
            audit/first350-official-syllabus-evidence-ci.md
          if-no-files-found: warn
      - name: Audit the first 350 live teaching chapters and reconcile spot checks
        run: node tests/notes-first350-evidence.cjs
      - name: Upload first-half per-topic evidence and risk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-first350-evidence
          path: |
            audit/notes-first350-evidence.json
            audit/notes-first350-evidence.md
          if-no-files-found: error
      - name: Reconcile FA and FFA 2026-27 detailed academic outcomes and numeric results
        run: node tests/notes-fa-ffa-academic-crosswalk.cjs
      - name: Upload academic syllabus-to-lesson evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa-ffa-2026-27-academic-crosswalk
          path: audit/fa-ffa-2026-27-internal-crosswalk.json
          if-no-files-found: error
      - name: Check browser release markers and cache refresh
        run: node tests/notes-release-regression.cjs
      - name: Check authoring inventory consistency and pending technical review
        run: node tests/notes-review-matrix.cjs
