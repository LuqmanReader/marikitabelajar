name: LedgerPeer topic quiz regression
on:
  push:
    paths:
      - 'quiz*.js'
      - 'tests/quiz-diversity-regression.cjs'
      - 'tests/quiz-integrated-regression.cjs'
      - 'tests/quiz-complete-count-regression.cjs'
      - 'quiz*.html'
      - 'quiz*.css'
      - 'notes-page.js'
      - 'notes-data.js'
      - 'notes-expanded-data.js'
      - 'acca-published-data.js'
      - 'notes-uk-syllabi.js'
      - 'tests/quiz-generator-regression.js'
      - 'tests/quiz-casebank-content-regression.cjs'
      - 'tests/quiz-difficulty-coverage-regression.cjs'
      - 'tests/quiz-million-simulation.cjs'
      - '.github/workflows/topic-quiz-regression.yml'
  pull_request:
    paths:
      - 'quiz*.js'
      - 'quiz*.html'
      - 'quiz*.css'
      - 'notes-page.js'
      - 'notes-data.js'
      - 'notes-expanded-data.js'
      - 'acca-published-data.js'
      - 'notes-uk-syllabi.js'
      - 'tests/quiz-generator-regression.js'
      - 'tests/quiz-casebank-content-regression.cjs'
      - 'tests/quiz-million-simulation.cjs'
      - 'tests/quiz-diversity-regression.cjs'
      - 'tests/quiz-integrated-regression.cjs'
      - 'tests/quiz-complete-count-regression.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check quiz-exam-bank.js
          node --check quiz-casebank-knowledge.js
          node --check quiz-casebank-ledger.js
          node --check quiz-diversity-bank.js
          node --check quiz-integrated-cases.js
          node --check quiz-engine.js
          node --check quiz-outcome-map.js
          node --check quiz-quality-engine.js
          node --check quiz-page.js
          node --check quiz-dashboard.js
      - name: Verify topic coverage, scoring and persistence
        run: node tests/quiz-generator-regression.js
      - name: Verify chapter difficulty, outcome gaps and navigator
        run: node tests/quiz-difficulty-coverage-regression.cjs
      - name: Check case quality and answer-key reasoning
        run: node tests/quiz-casebank-content-regression.cjs
      - name: Verify deep reasoning variety and reuse rotation
        run: node tests/quiz-diversity-regression.cjs
      - name: Verify integrated multi-topic case answers and quiz distribution
        run: node tests/quiz-integrated-regression.cjs
      - name: Verify full-length practice for every paper chapter and difficulty
        run: node tests/quiz-complete-count-regression.cjs
      - name: Run 1,000,000 real answer-marking simulations
        run: node tests/quiz-million-simulation.cjs
