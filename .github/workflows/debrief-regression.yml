name: FIA and ACCA debrief regression tests
on:
  push:
    paths:
      - 'tests/**'
      - 'subject-catalog.js'
      - 'syllabus-catalog.js'
      - 'official-exam-registry.js'
      - 'revision-flow.js'
      - 'chapter-analysis.js'
      - '.github/workflows/debrief-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 25-paper debrief regression
        run: node tests/debrief-regression.js
