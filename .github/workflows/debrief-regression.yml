name: FIA and ACCA debrief regression tests
on:
  push:
    paths:
      - 'tests/**'
      - 'auth.js'
      - 'exam-model.js'
      - 'hub.html'
      - 'index.html'
      - 'subject-catalog.js'
      - 'syllabus-catalog.js'
      - 'official-exam-registry.js'
      - 'revision-flow.js'
      - 'add-exam.html'
      - 'attempt-entry.js'
      - 'pdf-*.js'
      - 'universal-*-reader.js'
      - 'universal-pdf-document.js'
      - 'correction-pdf.js'
      - 'answer-option-match.js'
      - 'pdf-topic-suggestions.js'
      - 'view.html'
      - 'debrief-workflow.js'
      - 'extension/tymbaflex-bridge/quiz-figure-export.js'
      - 'chapter-analysis.js'
      - '.github/workflows/debrief-regression.yml'
  pull_request:
    paths:
      - 'add-exam.html'
      - 'attempt-entry.js'
      - 'revision-flow.js'
      - 'debrief-workflow.js'
      - 'view.html'
      - 'pdf-*.js'
      - 'universal-*-reader.js'
      - 'universal-pdf-document.js'
      - 'tests/**'
      - 'pdf-topic-suggestions.js'
      - 'tests/pdf-topic-fa2-regression.cjs'
      - '.github/workflows/debrief-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate saved exam title and classification editing
        run: node tests/exam-metadata-regression.cjs
      - name: Ensure AI-only topic classification boundary
        run: node tests/ai-only-topic-boundary.cjs
      - name: Run 25-paper debrief regression
        run: node tests/debrief-regression.js
      - name: Test responsive debrief with real DOM and clipboard interactions
        run: |
          npm install --no-save --package-lock=false --ignore-scripts jsdom@26 puppeteer-core@24
          node tests/pdf-html-first-regression.cjs
          node tests/debrief-ux-regression.cjs
          node tests/debrief-responsive-browser.cjs
      - name: Test image export and exact answer highlighting
        run: node tests/debrief-image-answer-regression.js
      - name: Test FIA/ACCA PDF attempt import formats
        run: |
          node tests/pdf-parser-regression.js
          node tests/pdf-input-recovery.cjs
          node tests/pdf-evidence-layout-regression.cjs
          node tests/pdf-question-visual-regression.cjs
          node tests/pdf-question20-ocr-regression.cjs
          node tests/pdf-question43-ocr-regression.cjs
          node tests/pdf-visual-matrix-regression.cjs
      - name: Check 2026-27 FA2 syllabus topic classification and abstention
        run: node tests/pdf-topic-fa2-regression.cjs
      - name: Create and inspect correction PDF output
        run: |
          npm install --no-save --package-lock=false --ignore-scripts pdf-lib@1.17.1
          node tests/correction-pdf-regression.cjs
      - name: Test email confirmation and callback safety
        run: node tests/email-confirmation-regression.js
