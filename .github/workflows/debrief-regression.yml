name: FIA and ACCA debrief regression tests
on:
  push:
    paths:
      - 'tests/**'
      - 'auth.js'
      - 'index.html'
      - 'subject-catalog.js'
      - 'syllabus-catalog.js'
      - 'official-exam-registry.js'
      - 'revision-flow.js'
      - 'source-archive.js'
      - 'source-prompt-injector.js'
      - 'pdf-attempt.js'
      - 'pdf-import.html'
      - 'add-exam.html'
      - 'answer-option-match.js'
      - 'pdf-topic-suggestions.js'
      - 'view.html'
      - 'debrief-workflow.js'
      - 'extension/tymbaflex-bridge/quiz-figure-export.js'
      - 'chapter-analysis.js'
      - '.github/workflows/debrief-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 25-paper debrief regression
        run: node tests/debrief-regression.js
      - name: Test image export and exact answer highlighting
        run: node tests/debrief-image-answer-regression.js
      - name: Test FIA/ACCA PDF attempt import formats
        run: node tests/pdf-parser-regression.js
      - name: Test original PDF plus reconstructed HTML archive and compact prompts
        run: node tests/dual-source-regression.js
      - name: Test code-aware prompt interpretation and evidence-grounded forecasting
        run: node tests/prompt-injector-regression.js
      - name: Test email confirmation and callback safety
        run: node tests/email-confirmation-regression.js
