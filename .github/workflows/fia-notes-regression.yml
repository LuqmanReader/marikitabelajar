name: FIA notes library regression
on:
  push:
    paths:
      - 'notes.html'
      - 'notes.css'
      - 'notes-data.js'
      - 'notes-expanded-data.js'
      - 'notes-uk-syllabi.js'
      - 'notes-page.js'
      - 'notes-build.js'
      - 'notes-release.json'
      - 'tests/notes-release-regression.cjs'
      - 'notes-visual-all.js'
      - 'notes-visual-workbook*.js'
      - 'notes-worked-tables*.js'
      - 'notes-outcome-lessons.js'
      - 'textbook-*.js'
      - 'assets/ledgerpeer-*.svg'
      - 'scripts/check-notes-visual-consistency.cjs'
      - 'scripts/check-all-chapter-visuals.cjs'
      - 'scripts/check-notes-currency-layout.cjs'
      - 'acca-published-data.js'
      - 'index.html'
      - 'hub.html'
      - 'calendar.html'
      - 'study-planner.html'
      - 'achievements.html'
      - 'financial-manager.html'
      - 'financial-dashboard.html'
      - 'quant-model.html'
      - 'tests/fia-notes-regression.js'
      - 'tests/notes-coverage-regression.js'
      - 'tests/notes-reader-regression.js'
      - '.github/workflows/fia-notes-regression.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate notes JavaScript syntax
        run: |
          node --check notes-data.js
          node --check notes-page.js
          node --check notes-build.js
          node --check notes-expanded-data.js
          node --check notes-uk-syllabi.js
          node --check notes-visual-all.js
          node --check notes-visual-workbook.js
          node --check notes-worked-tables-data.js
      - name: Test syllabus coverage and retired navigation
        run: |
          node tests/fia-notes-regression.js
          node tests/notes-coverage-regression.js
          node tests/notes-reader-regression.js
          node tests/notes-release-regression.cjs


      - name: Verify all 700 concept maps, currency and responsive workflow
        run: |
          node scripts/check-notes-visual-consistency.cjs
          node scripts/check-all-chapter-visuals.cjs
          node scripts/check-notes-currency-layout.cjs
