name: LedgerPeer Groq AI Tutor Regression
on:
  push:
    paths:
      - 'ai-tutor.html'
      - 'ai-tutor.js'
      - 'tutor-answer-renderer.js'
      - 'ai-tutor.css'
      - 'supabase/functions/ledgerpeer-ai/**'
      - 'supabase/ai-tutor-groq-usage.sql'
      - 'supabase/ai-tutor-groq-refund.sql'
      - 'tests/ai-tutor-groq-regression.js'
      - 'tests/ai-tutor-answer-renderer-regression.js'
      - '.github/workflows/ai-tutor-groq-regression.yml'
  pull_request:
    paths:
      - 'ai-tutor.html'
      - 'ai-tutor.js'
      - 'tutor-answer-renderer.js'
      - 'ai-tutor.css'
      - 'supabase/functions/ledgerpeer-ai/**'
      - 'supabase/ai-tutor-groq-usage.sql'
      - 'supabase/ai-tutor-groq-refund.sql'
      - 'tests/ai-tutor-groq-regression.js'
      - 'tests/ai-tutor-answer-renderer-regression.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script
        run: node --check ai-tutor.js
      - name: Verify AI Tutor integration contract
        run: node tests/ai-tutor-groq-regression.js
      - name: Verify student-safe answer rendering
        run: node tests/ai-tutor-answer-renderer-regression.js
